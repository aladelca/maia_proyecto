seed: 42
lgbm_patience: 40
lgbm_threads: 4
min_delta: 0.0001
nn_max_epochs: 50
nn_patience: 7
batch_size: 256
lgbm:
  - {name: reference, n_estimators: 300, learning_rate: 0.05, num_leaves: 15, min_child_samples: 20, max_bin: 255, colsample_bytree: 1.0, subsample: 1.0, subsample_freq: 0, reg_lambda: 0, weight_power: 1}
  - {name: compact_regularized, num_leaves: 15, min_child_samples: 100, reg_lambda: 3}
  - {name: medium_regularized, num_leaves: 31, min_child_samples: 100, reg_lambda: 3}
  - {name: medium_slow, learning_rate: 0.03, num_leaves: 31, min_child_samples: 100, reg_lambda: 5}
  - {name: medium_fast, learning_rate: 0.08, num_leaves: 31, min_child_samples: 100, reg_lambda: 3}
  - {name: large_regularized, num_leaves: 63, min_child_samples: 200, reg_lambda: 5}
  - {name: conservative, num_leaves: 31, min_child_samples: 500, reg_lambda: 10}
  - {name: compact_half_weights, num_leaves: 15, min_child_samples: 100, reg_lambda: 3, weight_power: 0.5}
  - {name: medium_half_weights, num_leaves: 31, min_child_samples: 100, reg_lambda: 3, weight_power: 0.5}
  - {name: large_half_weights, num_leaves: 63, min_child_samples: 200, reg_lambda: 5, weight_power: 0.5}
  - {name: sparse_regularized, num_leaves: 31, min_child_samples: 100, reg_alpha: 1, reg_lambda: 5, colsample_bytree: 0.6}
  - {name: unweighted, num_leaves: 31, min_child_samples: 100, reg_lambda: 5, weight_power: 0}
bilstm:
  - {name: reference145, view: raw145, hidden_size: 64, dropout: 0.3, weight_power: 1, lr: 0.0003}
  - {name: night145_moderate, view: night145, hidden_size: 64, dropout: 0.4, weight_power: 0.5, lr: 0.0003}
  - {name: context435_moderate, view: context435, hidden_size: 64, dropout: 0.4, weight_power: 0.5, lr: 0.0003}
  - {name: night435_moderate, view: night435, hidden_size: 64, dropout: 0.4, weight_power: 0.5, lr: 0.0003}
  - {name: night435_larger, view: night435, hidden_size: 128, dropout: 0.5, weight_power: 0.5, lr: 0.0003}
  - {name: night435_unweighted, view: night435, hidden_size: 64, dropout: 0.4, weight_power: 0, lr: 0.001}
